name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 验证与构建
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 后端测试
        working-directory: backend
        run: go test ./...

      - name: 前端静态检查
        working-directory: frontend
        run: npm run lint

      - name: 前端测试
        working-directory: frontend
        run: npm run test

      - name: 后端并发检查
        if: runner.os == 'Linux'
        working-directory: backend
        run: go test -race ./...

      - name: 安装浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 全栈端到端验证
        working-directory: frontend
        run: npm run test:e2e

      - name: 前端首屏体积预算
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          npm run build
          node scripts/size-audit.mjs --dist

      - name: 构建可运行包
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/local-gallery-ci-build"
          package_dir="$RUNNER_TEMP/local-gallery-ci-package"
          mkdir -p "$build_dir" "$package_dir/dist"
          (cd backend && CGO_ENABLED=0 go build \
            -ldflags "-X github.com/tianlongxiang/local-gallery/internal/config.Version=0.0.0-dev" \
            -o "$build_dir/local-gallery" ./cmd/server)
          cp "$build_dir/local-gallery" "$package_dir/"
          cp -R frontend/dist/. "$package_dir/dist/"
          cp backend/config.example.yaml "$package_dir/config.example.yaml"
          tar -czf "$RUNNER_TEMP/local-gallery-ci.tar.gz" -C "$RUNNER_TEMP" local-gallery-ci-package

      - name: 上传构建产物
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: local-gallery-ci-${{ github.sha }}
          path: ${{ runner.temp }}/local-gallery-ci.tar.gz
          if-no-files-found: error
          retention-days: 7
